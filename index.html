<style>
/* Reset & base */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow-x: hidden; /* horizontal white strip रोकने के लिए */
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background: #f8f9fa;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: #333;
  line-height: 1.6;
}

/* Layout container */
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px;
}

/* Logo / SVG / img responsiveness */
img, svg {
  max-width: 100%;
  height: auto;
  display: block;
}

/* Logo text */
.logo { display: flex; align-items: center; gap: 0.8rem; text-decoration: none; color: white; font-weight:700; }
.logo-icon { width: 50px; height: 50px; display:flex; align-items:center; justify-content:center; }
.logo-icon svg { width: 100%; height: auto; }

/* Navbar */
.navbar {
  background: linear-gradient(135deg, #005bea, #0052cc);
  color: white;
  padding: 0.8rem 0;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 3px 10px rgba(0,91,234,0.2);
}
.navbar .container { display:flex; justify-content:space-between; align-items:center; position:relative; }

/* Hamburger */
.nav-toggle { display:none; background:transparent; border:0; cursor:pointer; width:48px; height:48px; align-items:center; justify-content:center; }
.nav-toggle .hamburger { width:24px; height:2px; background:#fff; position:relative; display:block; }
.nav-toggle .hamburger::before, .nav-toggle .hamburger::after { content:""; position:absolute; left:0; width:24px; height:2px; background:#fff; transition:all .25s ease; }
.nav-toggle .hamburger::before { top:-7px; } .nav-toggle .hamburger::after { top:7px; }

/* Nav menu */
.nav-menu { display:flex; gap:2rem; list-style:none; }
.nav-menu a { color:white; text-decoration:none; font-weight:500; padding: 0.2rem 0; }
.nav-menu a:hover { color:#ffd700; }

/* Hero */
.hero { background: linear-gradient(135deg,#005bea,#00c6fb); color:#fff; padding:80px 20px; text-align:center; }
.hero-logo { display:inline-flex; align-items:center; gap:1rem; margin-bottom:2rem; padding:1rem 2rem; background: rgba(255,255,255,0.12); border-radius:20px; border:2px solid rgba(255,255,255,0.12); }
.hero-logo-icon { width:70px; height:70px; display:flex; align-items:center; justify-content:center; }
.hero-logo-icon svg { width:100%; height:auto; }

/* Headings */
.hero h1 { font-size:3rem; margin-bottom:0.5rem; text-shadow:2px 2px 4px rgba(0,0,0,0.2); }
.tagline { font-size:1.5rem; margin-bottom:0.5rem; }

/* Buttons */
.btn { display:inline-block; padding:12px 30px; border-radius:8px; font-weight:600; text-decoration:none; color:#fff; cursor:pointer; }
.btn-primary { background:#0d6efd; }
.btn-secondary { background:#25D366; }

/* Services grid and cards */
.services-section { padding:60px 20px; background:#fff; }
.services-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:2rem; }

/* Force 4 columns on wide desktop */
@media (min-width: 1100px) {
  .services-grid { grid-template-columns: repeat(4, 1fr); gap:1.5rem; }
}

/* Card */
.service-card { background:#f0f5ff; padding:2rem; border-radius:12px; text-align:left; border-left:5px solid #005bea; box-shadow:0 3px 10px rgba(0,91,234,0.1); display:flex; flex-direction:column; gap:0.75rem; }
.service-icon { font-size:2.5rem; margin-bottom:0.25rem; display:inline-block; }
.service-card h3 { color:#005bea; margin:0 0 0.25rem 0; }

/* Feature list: clamp to max 4 lines */
.service-features {
  list-style:none;
  margin:0 0 1rem 0.6rem;
  padding-left:0;
  text-align:left;
  line-height:1.25rem;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:4;
  overflow:hidden;
  max-height: calc(1.25rem * 4);
}
.service-features li { margin:0.25rem 0; color:#555; font-size:0.95rem; }

/* Footer, portfolio etc. kept minimal here -- can extend if needed */

/* Responsive adjustments */
@media (max-width: 880px) {
  /* Show hamburger */
  .nav-toggle { display:inline-flex; }

  /* Make nav-menu a dropdown overlay that fits inside viewport */
  .nav-menu {
    position: absolute;
    top: 64px;
    left: 8px;
    right: 8px;
    width: auto;          /* avoid calc overflow */
    background: linear-gradient(135deg,#005bea,#0052cc);
    padding: 1rem;
    border-radius: 8px;
    flex-direction: column;
    align-items: flex-start;
    gap:0.8rem;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.28s ease;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    display:flex;
  }
  .nav-menu.open { max-height: 500px; }
  .nav-menu a { width:100%; padding:0.6rem 0.4rem; }

  /* Shrink hero */
  .hero { padding: 40px 16px; }
  .hero h1 { font-size:1.6rem; }
  .hero-logo { padding:0.6rem 1rem; gap:0.6rem; }

  /* Services grid responsive fallback */
  .services-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:1rem; }
  .service-card { padding:1rem; }
  .service-icon { font-size:2rem; }
  .hero-buttons .btn { width:100%; display:block; text-align:center; }
  .logo-text-main { font-size:1rem; }
  .logo-text-sub { font-size:0.6rem; }
}

@media (max-width: 420px) {
  .services-grid { grid-template-columns: 1fr; gap:1rem; }
  .hero-logo-icon { width: 44px; height:44px; }
  .logo-icon svg { width:30px; height:auto; }
  .nav-menu { top: 56px; left:8px; right:8px; }
}

/* Small accessibility / visual tweaks */
a[role="button"], button { outline-offset: 3px; }
</style>
